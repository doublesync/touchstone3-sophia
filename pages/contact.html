<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Contact</title>
</head>
<body>
    <!-- Header / Navbar -->
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="services.html">Services</a></li>
            </ul>
        </nav>

        <h1>Contact</h1>
        <p>Have a question? Feel free to contact us!</p>
    </header>

    <main>
        <form>
            <fieldset>
                <legend>Volunteer or become a foster parent</legend>

                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="interest">Interest</label>
                <select id="interest" name="interest">
                    <option value="volunteer">Volunteer for us</option>
                    <option value="foster">Foster a pet</option>
                    <option value="adoption">Adopt a pet</option>
                </select>

                <label for="availability">Your Availability</label>
                <input type="text" id="availability" name="availability">

                <label for="experience">Pet Experience</label>
                <input type="text" id="experience" name="experience">

                <label for="message">Anything else?</label>
                <textarea id="message" name="message"></textarea>

                <button type="submit">Submit</button>
            </fieldset>
        </form>

        <section>
            <h2>Office Hours</h2>
            <p>Office hours are M-F from 8AM-5PM CST</p>
        </section>

        <section>
            <h2>Service Area</h2>
            <p>We service up to 80+ miles from Minneapolis</p>
        </section>
    </main>

    <footer>
        <small>&copy; 2026 Twin Cities Animal Rescue</small>
    </footer>
    
</body>
</html>
